name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip && pip install -e ".[test,security]"
      - run: python -m pip check
      - run: python -m compileall -q src tests
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=src --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - run: python -m pip freeze | grep -vE '^(tinlance-agent-platform-sdk==|-e )' > /tmp/audit-requirements.txt
      - run: pip-audit --strict -r /tmp/audit-requirements.txt
      - run: cyclonedx-py environment --output-format JSON --output-file sbom.json

  tsic-conformance:
    name: TSIC conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Verify pinned TSIC ecosystem contract
        run: python scripts/tsic_conformance.py

  package-smoke:
    name: Package smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - run: |
          python -m venv /tmp/sdk-smoke
          /tmp/sdk-smoke/bin/python -m pip install --no-index --find-links dist tinlance-agent-platform-sdk
          /tmp/sdk-smoke/bin/python -c "import importlib.metadata as m; import tinlance_agent_platform_sdk as sdk; assert m.version('tinlance-agent-platform-sdk') == sdk.SDK_VERSION"
