[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tinlance-agent-platform-sdk"
version = "1.0.0"
description = "Official developer SDK for building secure, governed AI agents on the Tinlance Agent Platform."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.12,<3.15"
authors = [{ name = "Tinlance Limited" }]
keywords = ["tinlance", "agent-platform", "ai-agents", "agent-sdk", "agentic-ai", "ai-security"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]

dependencies = []

[project.optional-dependencies]
test = [
  "mypy>=1.17,<3",
  "pytest>=8.4,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.12,<1",
]
security = [
  "pip-audit>=2.9,<3",
  "cyclonedx-bom>=7,<8",
]

[project.urls]
Homepage = "https://github.com/LloydCoder/tinlance-agent-platform-sdk"
Repository = "https://github.com/LloydCoder/tinlance-agent-platform-sdk"
Issues = "https://github.com/LloydCoder/tinlance-agent-platform-sdk/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tinlance_agent_platform_sdk"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/README.md", "/LICENSE", "/NOTICE", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["tinlance_agent_platform_sdk"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true

[project.scripts]
tinlance-agent-sdk = "tinlance_agent_platform_sdk.diagnostics:main"
